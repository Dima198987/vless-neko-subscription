name: Aggregate and Smart Sync to SourceCraft

on:
  workflow_dispatch:
  schedule:
    - cron: '12,42 * * * *'

permissions:
  contents: write

jobs:
  process-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run aggregator script
        run: python scraper.py

      - name: Check if file exists
        run: |
          if [ ! -s "vless_configs.txt" ]; then
            echo "❌ Ошибка: файл vless_configs.txt отсутствует или пустой!"
            exit 1
          fi

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit to GitHub Main Repo
        run: |
          git add vless_configs.txt
          if git diff --staged --quiet; then
            echo "Нет изменений для основного репозитория."
          else
            git commit -m "chore: update local configs [skip ci]"
            git push origin main
          fi

      - name: SMART SYNC to SourceCraft (С логикой сравнения)
        env:
          SOURCECRAFT_URL: "https://anyname:${{ secrets.SOURCECRAFT_TOKEN }}@git.sourcecraft.dev/dmartyan/vless-sub.git"
          EXT_URL_1: "https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt"
          EXT_URL_2: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt"
        run: |
          # 1. Создаем чистую папку
          rm -rf sync-temp
          mkdir sync-temp
          cd sync-temp
          
          # 2. Инициализация
          git init -b main
          git remote add origin "$SOURCECRAFT_URL"
          git fetch origin || true
          
          # 3. Синхронизация с сервером
          git checkout -B main origin/main || git checkout --orphan main
          
          # 4. Сохраняем старые версии для сравнения
          mkdir -p old-versions
          cp vless_universal.txt old-versions/ 2>/dev/null || true
          cp Vless-Reality-White-Lists-Rus-Mobile.txt old-versions/ 2>/dev/null || true
          cp vless_configs.txt old-versions/ 2>/dev/null || true
          
          # 5. Удаляем старые файлы
          find . -maxdepth 1 -type f -name "*.txt" -delete
          
          # 6. Копируем свежий локальный файл
          cp ../vless_configs.txt .
          
          # 7. Скачиваем внешние файлы с обходом кэша
          echo "Скачиваем zieng2..."
          curl -sS -f -H "Cache-Control: no-cache" -o vless_universal.txt "${EXT_URL_1}?t=$(date +%s)" || echo "⚠️ Ошибка zieng2"
          
          echo "Скачиваем igareck..."
          curl -sS -f -H "Cache-Control: no-cache" -o Vless-Reality-White-Lists-Rus-Mobile.txt "${EXT_URL_2}?t=$(date +%s)" || echo "⚠️ Ошибка igareck"
          
          echo "--- РАЗМЕРЫ НОВЫХ ФАЙЛОВ ---"
          wc -c *.txt
          echo "-----------------------------"
          
          # 8. СРАВНЕНИЕ: Проверяем, изменились ли файлы
          CHANGED=false
          
          if ! cmp -s vless_universal.txt old-versions/vless_universal.txt 2>/dev/null; then
            echo "✅ vless_universal.txt изменился"
            CHANGED=true
          else
            echo "⚠️ vless_universal.txt не изменился"
          fi
          
          if ! cmp -s Vless-Reality-White-Lists-Rus-Mobile.txt old-versions/Vless-Reality-White-Lists-Rus-Mobile.txt 2>/dev/null; then
            echo "✅ Vless-Reality-White-Lists-Rus-Mobile.txt изменился"
            CHANGED=true
          else
            echo "⚠️ Vless-Reality-White-Lists-Rus-Mobile.txt не изменился"
          fi
          
          if ! cmp -s vless_configs.txt old-versions/vless_configs.txt 2>/dev/null; then
            echo "✅ vless_configs.txt изменился"
            CHANGED=true
          else
            echo "⚠️ vless_configs.txt не изменился"
          fi
          
          # 9. Коммитим только если есть изменения
          if [ "$CHANGED" = true ]; then
            git add -A
            git commit -m "chore: smart sync - files updated"
            git push origin main --force
            echo "✅ Файлы обновлены и отправлены на SourceCraft!"
          else
            echo "⚠️ Ни один файл не изменился. Пропускаем отправку на SourceCraft."
          fi
