name: Aggregate and Smart Sync to SourceCraft

on:
  workflow_dispatch:
  schedule:
    - cron: '0,30 * * * *'

permissions:
  contents: write

jobs:
  process-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run aggregator script
        run: python scraper.py

      - name: Check if file exists
        run: |
          if [ ! -s "vless_configs.txt" ]; then
            echo "❌ Ошибка: файл vless_configs.txt отсутствует или пустой!"
            exit 1
          fi

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit to GitHub Main Repo
        run: |
          git add vless_configs.txt
          git commit -m "chore: update configs [skip ci]" || echo "No changes"
          git push origin main || true

      - name: SYNC to SourceCraft (Via GitHub API - Bypass Cache)
        env:
          SOURCECRAFT_URL: "https://anyname:${{ secrets.SOURCECRAFT_TOKEN }}@git.sourcecraft.dev/dmartyan/vless-sub.git"
        run: |
          rm -rf sync-temp
          mkdir sync-temp
          cd sync-temp
          
          git init -b main
          git remote add origin "$SOURCECRAFT_URL"
          git fetch origin || true
          git checkout -B main origin/main || git checkout --orphan main
          
          find . -maxdepth 1 -type f -name "*.txt" -delete
          cp ../vless_configs.txt .
          
          echo "=========================================="
          echo "🔥 СКАЧИВАЕМ ЧЕРЕЗ GITHUB API (обход кэша)"
          echo "=========================================="
          
          # Скачиваем через GitHub API - это обходит Raw CDN кэш
          echo "Скачиваем zieng2 через API..."
          curl -sS -H "Accept: application/vnd.github.v3.raw" \
            -o vless_universal.txt \
            "https://api.github.com/repos/zieng2/wl/contents/vless_universal.txt?ref=main" || echo "⚠️ Ошибка zieng2"
          
          echo "Скачиваем igareck через API..."
          curl -sS -H "Accept: application/vnd.github.v3.raw" \
            -o Vless-Reality-White-Lists-Rus-Mobile.txt \
            "https://api.github.com/repos/igareck/vpn-configs-for-russia/contents/Vless-Reality-White-Lists-Rus-Mobile.txt?ref=main" || echo "⚠️ Ошибка igareck"
          
          echo ""
          echo "--- РАЗМЕРЫ ФАЙЛОВ ---"
          wc -c *.txt
          echo "Первые 3 строки vless_universal.txt:"
          head -n 3 vless_universal.txt
          echo ""
          
          git add -A
          git commit -m "chore: sync via API $(date +%s)" || echo "No changes"
          git push origin main --force || true
          
          echo "✅ Синхронизация через GitHub API завершена!"
