name: Aggregate and Sync to GitFlic

on:
  workflow_dispatch: # Ручной запуск по кнопке
  schedule:
    - cron: '0 */2 * * *' # Автоматический запуск каждые 2 часа

permissions:
  contents: write

jobs:
  process-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Загружаем полную историю, чтобы избежать конфликтов при пуше в два места
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run aggregator script
        run: python scraper.py

      - name: Check if file exists and is not empty
        run: |
          if [ ! -s "vless_configs.txt" ]; then
            echo "❌ Ошибка: файл vless_configs.txt отсутствует или пустой!"
            exit 1
          fi
          echo "✅ Файл успешно сгенерирован."

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and Sync to GitHub and GitFlic
        env:
          GITFLIC_URL: "https://dmartyan:${{ secrets.GITFLIC_TOKEN }}@gitflic.ru/project/dmartyan/vless-sub.git"
        run: |
          git add vless_configs.txt
          
          if git diff --staged --quiet; then
            echo "⚠️ Нет изменений в конфигурациях. Пропускаем синхронизацию."
          else
            echo "🔄 Найдены изменения. Выполняем коммит и синхронизацию..."
            
            # 1. Коммит и пуш в основной репозиторий GitHub
            git commit -m "chore: обновлены конфигурации VLESS [skip ci]"
            git push origin main
            
            # 2. Добавляем GitFlic как удаленный репозиторий
            git remote add gitflic "$GITFLIC_URL"
            
            # 3. ПРИНУДИТЕЛЬНЫЙ пуш на GitFlic, чтобы избежать ошибок рассинхронизации истории
            echo "Отправляем зеркало на GitFlic..."
            git push --force gitflic main
            
            echo "✅ Файл успешно синхронизирован с GitHub и GitFlic!"
          fi
