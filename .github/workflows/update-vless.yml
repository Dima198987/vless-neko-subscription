name: Aggregate and Update VLESS Configs

on:
  workflow_dispatch:  # Ручной запуск из вкладки Actions
  schedule:
    - cron: '0 */2 * * *'  # Автоматический запуск каждые 2 часа

permissions:
  contents: write

jobs:
  aggregate-vless:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run aggregator script
        run: python scraper.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          touch vless_configs.txt
          git add vless_configs.txt
          
          if git diff --staged --quiet; then
            echo "Нет изменений для коммита."
          else
            git commit -m "chore: обновлены конфигурации VLESS"
            git push
          fi
