name: Aggregate and Sync to SourceCraft

on:
  workflow_dispatch: # Ручной запуск по кнопке
  schedule:
    - cron: '12,42 * * * *' # Нестандартное время для избегания задержек GitHub

permissions:
  contents: write

jobs:
  process-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run aggregator script
        run: python scraper.py

      - name: Check if file exists and is not empty
        run: |
          if [ ! -s "vless_configs.txt" ]; then
            echo "❌ Ошибка: файл vless_configs.txt отсутствует или пустой!"
            exit 1
          fi
          echo "✅ Локальный файл успешно сгенерирован."

      - name: Configure Git for main repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push to GitHub (Full Repo)
        run: |
          git add vless_configs.txt
          if git diff --staged --quiet; then
            echo "⚠️ Нет изменений. Пропускаем коммит в основной репозиторий."
          else
            git commit -m "chore: обновлены конфигурации VLESS [skip ci]"
            git push origin main
            echo "✅ Основной репозиторий GitHub обновлен."
          fi

      - name: Sync Exact Files to SourceCraft
        env:
          SOURCECRAFT_URL: "https://anyname:${{ secrets.SOURCECRAFT_TOKEN }}@git.sourcecraft.dev/dmartyan/vless-sub.git"
          EXT_URL_1: "https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt"
          EXT_URL_2: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt"
        run: |
          mkdir sourcecraft-temp
          cd sourcecraft-temp
          
          git init -b main
          git remote add origin "$SOURCECRAFT_URL"
          git pull origin main || echo "Репозиторий SourceCraft пуст"
          
          echo "Очищаем старые файлы..."
          find . -maxdepth 1 -type f -name "*.txt" -delete
          
          cp ../vless_configs.txt .
          
          echo "Скачиваем внешние подписки с принудительным сбросом кэша..."
          # Добавляем ?t=текущее_время прямо в URL. Это гарантированно ломает кэш GitHub CDN
          curl -sS -f -H "Cache-Control: no-cache" -o vless_universal.txt "${EXT_URL_1}?t=$(date +%s)" || echo "⚠️ Ошибка скачивания vless_universal.txt"
          
          curl -sS -f -H "Cache-Control: no-cache" -o Vless-Reality-White-Lists-Rus-Mobile.txt "${EXT_URL_2}?t=$(date +%s)" || echo "⚠️ Ошибка скачивания Vless-Reality"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          if git diff --staged --quiet; then
            echo "⚠️ Нет изменений в файлах. Пропускаем отправку."
          else
            git commit -m "chore: синхронизация файлов с обходом кэша"
            git push -u origin main
            echo "✅ Файлы успешно отправлены на SourceCraft!"
          fi
