name: Aggregate and Smart Sync to SourceCraft

on:
  workflow_dispatch:
  schedule:
    - cron: '12,42 * * * *'

permissions:
  contents: write

jobs:
  process-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run aggregator script
        run: python scraper.py

      - name: Check if file exists
        run: |
          if [ ! -s "vless_configs.txt" ]; then
            echo "❌ Ошибка: файл vless_configs.txt отсутствует или пустой!"
            exit 1
          fi

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit to GitHub Main Repo
        run: |
          git add vless_configs.txt
          
          # Всегда добавляем timestamp в файл, чтобы Git видел изменение
          echo "# Last update: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> vless_configs.txt
          
          git add vless_configs.txt
          git commit -m "chore: update local configs $(date +%s) [skip ci]" || echo "No changes"
          git push origin main || true

      - name: SMART SYNC to SourceCraft
        env:
          SOURCECRAFT_URL: "https://anyname:${{ secrets.SOURCECRAFT_TOKEN }}@git.sourcecraft.dev/dmartyan/vless-sub.git"
          EXT_URL_1: "https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt"
          EXT_URL_2: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt"
        run: |
          rm -rf sync-temp
          mkdir sync-temp
          cd sync-temp
          
          git init -b main
          git remote add origin "$SOURCECRAFT_URL"
          git fetch origin || true
          git checkout -B main origin/main || git checkout --orphan main
          
          find . -maxdepth 1 -type f -name "*.txt" -delete
          cp ../vless_configs.txt .
          
          # Скачиваем с обходом кэша
          curl -sS -f -H "Cache-Control: no-cache" -o vless_universal.txt "${EXT_URL_1}?nocache=$(date +%s%N)" || echo "⚠️ Ошибка zieng2"
          curl -sS -f -H "Cache-Control: no-cache" -o Vless-Reality-White-Lists-Rus-Mobile.txt "${EXT_URL_2}?nocache=$(date +%s%N)" || echo "⚠️ Ошибка igareck"
          
          echo "--- РАЗМЕРЫ ФАЙЛОВ ---"
          wc -c *.txt
          
          # Всегда коммитим, чтобы обновить дату на SourceCraft
          git add -A
          git commit -m "chore: sync $(date +%s)" || echo "No changes"
          git push origin main --force || true
          
          echo "✅ Синхронизация завершена!"
