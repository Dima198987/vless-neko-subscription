name: Aggregate and Sync to SourceCraft

on:
  workflow_dispatch:
  schedule:
    - cron: '12,42 * * * *'

permissions:
  contents: write

jobs:
  process-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run aggregator script
        run: python scraper.py

      - name: Check if file exists and is not empty
        run: |
          if [ ! -s "vless_configs.txt" ]; then
            echo "❌ Ошибка: файл vless_configs.txt отсутствует или пустой!"
            exit 1
          fi

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit to GitHub Main Repo
        run: |
          git add vless_configs.txt
          if git diff --staged --quiet; then
            echo "Нет изменений для основного репозитория."
          else
            git commit -m "chore: update local configs [skip ci]"
            git push origin main
          fi

      - name: FORCE SYNC to SourceCraft (Fixed Git Branching)
        env:
          SOURCECRAFT_URL: "https://anyname:${{ secrets.SOURCECRAFT_TOKEN }}@git.sourcecraft.dev/dmartyan/vless-sub.git"
          EXT_URL_1: "https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt"
          EXT_URL_2: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt"
        run: |
          # 1. Создаем ЧИСТУЮ папку
          rm -rf sync-temp
          mkdir sync-temp
          cd sync-temp
          
          # 2. Инициализируем репозиторий сразу с веткой main
          git init -b main
          git remote add origin "$SOURCECRAFT_URL"
          
          # 3. Получаем данные с сервера (игнорируем ошибку, если репозиторий абсолютно пуст)
          git fetch origin || true
          
          # 4. ЖЕСТКО приводим ветку main в соответствие с сервером (исправляет ошибку detached HEAD)
          git reset --hard origin/main || true
          
          # 5. Удаляем ВСЕ старые .txt файлы
          find . -maxdepth 1 -type f -name "*.txt" -delete
          
          # 6. Копируем свежий локальный файл
          cp ../vless_configs.txt .
          
          # 7. Скачиваем внешние файлы с обходом кэша
          echo "Скачиваем zieng2..."
          curl -sS -f -H "Cache-Control: no-cache" -o vless_universal.txt "${EXT_URL_1}?t=$(date +%s)"
          
          echo "Скачиваем igareck..."
          curl -sS -f -H "Cache-Control: no-cache" -o Vless-Reality-White-Lists-Rus-Mobile.txt "${EXT_URL_2}?t=$(date +%s)"
          
          # 8. ДИАГНОСТИКА
          echo "--- РАЗМЕРЫ ФАЙЛОВ ПЕРЕД ОТПРАВКОЙ ---"
          wc -c *.txt
          echo "--------------------------------------"
          
          # 9. Добавляем все изменения
          git add -A
          
          # 10. Коммитим (даже если изменений нет, чтобы обновить дату на сайте)
          git commit --allow-empty -m "chore: forced sync $(date +%s)"
          
          # 11. ПРИНУДИТЕЛЬНЫЙ ПУШ. Теперь он сработает, так как ветка main существует и корректна
          git push origin main --force
          
          echo "✅ ПРИНУДИТЕЛЬНАЯ СИНХРОНИЗАЦИЯ УСПЕШНО ЗАВЕРШЕНА!"
