name: Aggregate and Sync to SourceCraft

on:
  workflow_dispatch: # Ручной запуск по кнопке
  schedule:
    - cron: '0 */2 * * *' # Автоматический запуск каждые 2 часа

permissions:
  contents: write

jobs:
  process-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run aggregator script
        run: python scraper.py

      - name: Check if file exists and is not empty
        run: |
          if [ ! -s "vless_configs.txt" ]; then
            echo "❌ Ошибка: файл vless_configs.txt отсутствует или пустой!"
            exit 1
          fi
          echo "✅ Файл успешно сгенерирован."

      - name: Configure Git for main repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push to GitHub (Full Repo)
        run: |
          git add vless_configs.txt
          if git diff --staged --quiet; then
            echo "⚠️ Нет изменений. Пропускаем коммит в основной репозиторий."
          else
            git commit -m "chore: обновлены конфигурации VLESS [skip ci]"
            git push origin main
            echo "✅ Основной репозиторий GitHub обновлен."
          fi

      - name: Sync ONLY config file to SourceCraft
        env:
          # HTTPS-ссылка с использованием токена в качестве пароля
          SOURCECRAFT_URL: "https://anyname:${{ secrets.SOURCECRAFT_TOKEN }}@git.sourcecraft.dev/dmartyan/vless-sub.git"
        run: |
          # 1. Создаем изолированную папку для SourceCraft
          mkdir sourcecraft-temp
          cd sourcecraft-temp
          
          # 2. Инициализируем git сразу с веткой main
          git init -b main
          git remote add origin "$SOURCECRAFT_URL"
          
          # 3. Пытаемся получить текущее состояние (игнорируем ошибку, если репозиторий совершенно пуст)
          git pull origin main || echo "Репозиторий SourceCraft пуст, создаем новую историю"
          
          # 4. Копируем ТОЛЬКО файл подписки из родительской папки
          cp ../vless_configs.txt .
          
          # 5. Настраиваем git локально для этой папки
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add vless_configs.txt
          
          # 6. Коммитим и отправляем, если есть изменения
          if git diff --staged --quiet; then
            echo "⚠️ Нет изменений в файле подписки. Пропускаем отправку на SourceCraft."
          else
            git commit -m "chore: обновлен файл подписки vless_configs.txt"
            git push -u origin main
            echo "✅ ТОЛЬКО файл vless_configs.txt успешно отправлен на SourceCraft!"
          fi
