name: Aggregate and Sync to SourceCraft

on:
  workflow_dispatch: # Ручной запуск по кнопке
  schedule:
    - cron: '12,42 * * * *' # Нестандартное время: каждые ~30 минут, но без задержек GitHub

permissions:
  contents: write

jobs:
  process-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run aggregator script
        run: python scraper.py

      - name: Check if file exists and is not empty
        run: |
          if [ ! -s "vless_configs.txt" ]; then
            echo "❌ Ошибка: файл vless_configs.txt отсутствует или пустой!"
            exit 1
          fi
          echo "✅ Локальный файл успешно сгенерирован."

      - name: Configure Git for main repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push to GitHub (Full Repo)
        run: |
          git add vless_configs.txt
          if git diff --staged --quiet; then
            echo "⚠️ Нет изменений. Пропускаем коммит в основной репозиторий."
          else
            git commit -m "chore: обновлены конфигурации VLESS [skip ci]"
            git push origin main
            echo "✅ Основной репозиторий GitHub обновлен."
          fi

      - name: Sync Exact Files to SourceCraft
        env:
          # Ссылка для авторизации в SourceCraft
          SOURCECRAFT_URL: "https://anyname:${{ secrets.SOURCECRAFT_TOKEN }}@git.sourcecraft.dev/dmartyan/vless-sub.git"
          # Внешняя подписка 1
          EXT_URL_1: "https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt"
          # Внешняя подписка 2
          EXT_URL_2: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt"
        run: |
          # 1. Создаем изолированную папку для SourceCraft
          mkdir sourcecraft-temp
          cd sourcecraft-temp
          
          # 2. Инициализируем git сразу с веткой main
          git init -b main
          git remote add origin "$SOURCECRAFT_URL"
          
          # 3. Пытаемся получить текущее состояние (игнорируем ошибку, если репозиторий совершенно пуст)
          git pull origin main || echo "Репозиторий SourceCraft пуст, создаем новую историю"
          
          # 4. УДАЛЯЕМ все старые .txt файлы из репозитория, чтобы не было мусора
          echo "Очищаем старые файлы подписок..."
          find . -maxdepth 1 -type f -name "*.txt" -delete
          
          # 5. Копируем наш сгенерированный файл с ОРИГИНАЛЬНЫМ именем
          cp ../vless_configs.txt .
          
          # 6. Скачиваем внешние подписки с ОРИГИНАЛЬНЫМИ именами файлов
          echo "Скачиваем внешние подписки..."
          curl -sS -f -o vless_universal.txt "$EXT_URL_1" || echo "⚠️ Не удалось скачать vless_universal.txt"
          curl -sS -f -o Vless-Reality-White-Lists-Rus-Mobile.txt "$EXT_URL_2" || echo "⚠️ Не удалось скачать Vless-Reality-White-Lists-Rus-Mobile.txt"
          
          # 7. Настраиваем git локально для этой папки
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 8. Добавляем ВСЕ изменения (включая удаления старых и создание новых с правильными именами)
          git add -A
          
          # 9. Коммитим и отправляем, только если есть реальные изменения
          if git diff --staged --quiet; then
            echo "⚠️ Нет изменений в файлах подписок. Пропускаем отправку на SourceCraft."
          else
            git commit -m "chore: синхронизация файлов подписок с оригинальными именами"
            git push -u origin main
            echo "✅ Файлы успешно отправлены на SourceCraft!"
          fi
