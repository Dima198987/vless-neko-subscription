name: Aggregate and Force Sync to SourceCraft

on:
  workflow_dispatch:
  schedule:
    - cron: '12,42 * * * *' # Запуск каждые ~30 минут

permissions:
  contents: write

jobs:
  process-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run aggregator script
        run: python scraper.py

      - name: Check if file exists
        run: |
          if [ ! -s "vless_configs.txt" ]; then
            echo "❌ Ошибка: файл vless_configs.txt отсутствует или пустой!"
            exit 1
          fi

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit to GitHub Main Repo
        run: |
          git add vless_configs.txt
          git commit -m "chore: update local configs [skip ci]" || echo "No changes in main repo"
          git push origin main || true

      - name: FORCE UPDATE SourceCraft (Без сравнений)
        env:
          SOURCECRAFT_URL: "https://anyname:${{ secrets.SOURCECRAFT_TOKEN }}@git.sourcecraft.dev/dmartyan/vless-sub.git"
          EXT_URL_1: "https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt"
          EXT_URL_2: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt"
        run: |
          # 1. Полная очистка
          rm -rf sync-temp
          mkdir sync-temp
          cd sync-temp
          
          # 2. Инициализация
          git init -b main
          git remote add origin "$SOURCECRAFT_URL"
          git fetch origin || true
          
          # 3. Синхронизация ветки (исправляет detached HEAD)
          git checkout -B main origin/main || git checkout --orphan main
          
          # 4. Удаляем старые файлы
          find . -maxdepth 1 -type f -name "*.txt" -delete
          
          # 5. Добавляем TIMESTAMP в начало файла. Это ГАРАНТИРУЕТ, что Git увидит изменение каждый раз!
          echo "# LAST_UPDATE: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" > vless_configs.txt
          cat ../vless_configs.txt >> vless_configs.txt
          
          # 6. Скачиваем внешние файлы с обходом кэша
          echo "Скачиваем zieng2..."
          curl -sS -f -H "Cache-Control: no-cache" -o vless_universal.txt "${EXT_URL_1}?t=$(date +%s)" || echo "⚠️ Ошибка zieng2"
          
          echo "Скачиваем igareck..."
          curl -sS -f -H "Cache-Control: no-cache" -o Vless-Reality-White-Lists-Rus-Mobile.txt "${EXT_URL_2}?t=$(date +%s)" || echo "⚠️ Ошибка igareck"
          
          echo "--- РАЗМЕРЫ ФАЙЛОВ ---"
          wc -c *.txt
          echo "----------------------"
          
          # 7. БЕЗУСЛОВНЫЙ коммит и пуш
          git add -A
          git commit -m "chore: forced update $(date +%s)"
          git push origin main --force
          
          echo "✅ БЕЗУСЛОВНОЕ ОБНОВЛЕНИЕ НА SOURCECRAFT ЗАВЕРШЕНО!"
