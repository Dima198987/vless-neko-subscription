name: Aggregate and Smart Sync to SourceCraft

on:
  workflow_dispatch:
  schedule:
    - cron: '0,30 * * * *'

permissions:
  contents: write

jobs:
  process-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run aggregator script
        run: python scraper.py

      - name: Check if file exists
        run: |
          if [ ! -s "vless_configs.txt" ]; then
            echo "❌ Ошибка: файл vless_configs.txt отсутствует или пустой!"
            exit 1
          fi

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit to GitHub Main Repo
        run: |
          git add vless_configs.txt
          git commit -m "chore: update configs [skip ci]" || echo "No changes"
          git push origin main || true

      - name: FORCE UPDATE SourceCraft (Inject Timestamp)
        env:
          SOURCECRAFT_URL: "https://anyname:${{ secrets.SOURCECRAFT_TOKEN }}@git.sourcecraft.dev/dmartyan/vless-sub.git"
        run: |
          rm -rf sync-temp
          mkdir sync-temp
          cd sync-temp
          
          git init -b main
          git remote add origin "$SOURCECRAFT_URL"
          git fetch origin || true
          git checkout -B main origin/main || git checkout --orphan main
          
          find . -maxdepth 1 -type f -name "*.txt" -delete
          
          # 1. Обрабатываем локальный файл: добавляем гигантский заголовок с временем
          echo "# === ОБНОВЛЕНО: $(date -u +"%Y-%m-%d %H:%M:%S UTC") ===" > temp_vless.txt
          cat ../vless_configs.txt >> temp_vless.txt
          mv temp_vless.txt vless_configs.txt
          
          # 2. Скачиваем внешние файлы
          curl -sS -H "Accept: application/vnd.github.v3.raw" -H "Cache-Control: no-cache" -o temp_zieng2.txt "https://api.github.com/repos/zieng2/wl/contents/vless_universal.txt?ref=main&nocache=$(date +%s)"
          echo "# === ОБНОВЛЕНО: $(date -u +"%Y-%m-%d %H:%M:%S UTC") ===" > vless_universal.txt
          cat temp_zieng2.txt >> vless_universal.txt
          
          curl -sS -H "Accept: application/vnd.github.v3.raw" -H "Cache-Control: no-cache" -o temp_igareck.txt "https://api.github.com/repos/igareck/vpn-configs-for-russia/contents/Vless-Reality-White-Lists-Rus-Mobile.txt?ref=main&nocache=$(date +%s)"
          echo "# === ОБНОВЛЕНО: $(date -u +"%Y-%m-%d %H:%M:%S UTC") ===" > Vless-Reality-White-Lists-Rus-Mobile.txt
          cat temp_igareck.txt >> Vless-Reality-White-Lists-Rus-Mobile.txt
          
          echo "--- РАЗМЕРЫ ФАЙЛОВ ---"
          wc -c *.txt
          echo "ПЕРВАЯ СТРОКА vless_universal.txt:"
          head -n 1 vless_universal.txt
          
          git add -A
          git commit -m "chore: force update with timestamp $(date +%s)" || echo "No changes"
          git push origin main --force || true
          
          echo "✅ ПРИНУДИТЕЛЬНОЕ ОБНОВЛЕНИЕ С ТАЙМСТАМПОМ ЗАВЕРШЕНО!"
