```yaml
name: Update VLESS subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "collect_vless.py"
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-vless-subscription
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install sing-box
        shell: bash
        run: |
          set -euo pipefail

          ASSET_URL="$(
            python - <<'PY'
          import json
          import urllib.request

          url = "https://api.github.com/repos/SagerNet/sing-box/releases/latest"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "vless-subscription-workflow"},
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              release = json.load(response)

          assets = release.get("assets", [])
          matches = [
              asset["browser_download_url"]
              for asset in assets
              if asset.get("name", "").endswith("linux-amd64.tar.gz")
          ]

          if not matches:
              raise SystemExit(
                  "Could not find a Linux amd64 sing-box release archive."
              )

          print(matches[0])
          PY
          )"

          curl -fL "$ASSET_URL" -o /tmp/sing-box.tar.gz
          mkdir -p /tmp/sing-box-extract
          tar -xzf /tmp/sing-box.tar.gz -C /tmp/sing-box-extract

          BIN="$(find /tmp/sing-box-extract -type f -name sing-box -perm -111 -print -quit)"
          test -n "$BIN"

          sudo install "$BIN" /usr/local/bin/sing-box
          sing-box version

      - name: Run VLESS collector
        env:
          HTTP_TEST_URL: https://example.com/
          MAX_NODES: "10"
          MAX_LIST_PAGES: "5"
          TEST_TIMEOUT: "18"
        run: python collect_vless.py

      - name: Commit updated subscription
        shell: bash
        run: |
          set -euo pipefail

          git add working_vless.txt

          if git diff --cached --quiet; then
            echo "working_vless.txt has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update working VLESS subscription"
          git push
```
