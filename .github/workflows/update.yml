name: Update VLESS subscription

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vless-subscription-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install sing-box
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          VERSION="${VERSION#v}"
          ARCHIVE="sing-box-${VERSION}-linux-amd64.tar.gz"
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/${ARCHIVE}" -o /tmp/sing-box.tar.gz
          mkdir -p /tmp/sing-box
          tar -xzf /tmp/sing-box.tar.gz -C /tmp/sing-box
          BIN="$(find /tmp/sing-box -type f -name sing-box -print -quit)"
          test -n "$BIN"
          sudo install "$BIN" /usr/local/bin/sing-box
          sing-box version

      - name: Collect and test VLESS profiles
        env:
          MAX_PAGES: "5"
          MAX_NODES: "100"
          TEST_TIMEOUT: "12"
          HTTP_TEST_URL: "https://www.gstatic.com/generate_204"
        run: python collect_vless.py

      - name: Commit updated subscription
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working_vless.txt
          if git diff --cached --quiet; then
            echo "Subscription unchanged."
          else
            git commit -m "Update working VLESS subscription"
            git push
          fi
